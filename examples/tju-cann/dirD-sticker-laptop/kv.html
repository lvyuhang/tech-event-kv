<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--b:#2F6BFF;--m:#4FDDAA;--ink:#0E1124;--y:#FFD45C;--p:#FF8FB0;--l:#B9A8FF}
body{width:2560px;height:1440px;position:relative;overflow:hidden;font-family:"Noto Sans CJK SC";background:#E9E6FF}
.lid{position:absolute;left:110px;top:60px;width:2340px;height:1320px;border-radius:70px;
 background:linear-gradient(135deg,#E3E7EF 0%,#CDD3DE 45%,#D9DEE7 100%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.7),inset 0 -10px 30px rgba(0,0,0,.06),0 30px 60px rgba(60,50,140,.18)}
.lid:after{content:"";position:absolute;inset:0;border-radius:70px;background:linear-gradient(115deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.3) 100%)}
.s{position:absolute;filter:drop-shadow(0 10px 12px rgba(30,30,80,.22))}
.cut{box-shadow:0 0 0 12px #fff}
.peel{position:absolute;right:-12px;bottom:-12px;width:110px;height:110px;background:linear-gradient(135deg,#fff 0%,#F2F2F6 48%,transparent 49%);clip-path:polygon(100% 0,100% 100%,0 100%);transform:scaleX(-1) scaleY(-1);transform-origin:center;border-radius:0 0 30px 0}
.title{left:300px;top:360px;width:1640px;height:530px;background:var(--b);border-radius:56px;transform:rotate(-3deg);color:#fff;padding:56px 70px}
.title .a{font:900 54px "Noto Sans CJK SC";letter-spacing:.32em}
.title .b{margin-top:8px;font:900 160px "Noto Sans CJK SC";letter-spacing:-.02em;line-height:1.05;white-space:nowrap}
.title .b em{font:900 178px "Inter Display";font-style:normal;letter-spacing:-.04em;color:#BFF5DF}
.title .c{margin-top:22px;font:900 56px "Noto Sans CJK SC";letter-spacing:.14em;color:var(--y)}
.slogan{left:540px;top:950px;background:var(--y);border-radius:999px;padding:26px 60px;font:900 64px "Noto Sans CJK SC";color:var(--ink);transform:rotate(2deg)}
.slogan:after{content:"";position:absolute;left:110px;top:-36px;border:22px solid transparent;border-bottom:40px solid var(--y);border-left:10px solid var(--y)}
.info{left:1720px;top:1150px;background:var(--ink);color:#fff;border-radius:22px;display:flex;align-items:center;font:700 44px "Noto Sans CJK SC";transform:rotate(-2deg);overflow:hidden}
.info span{padding:22px 34px}.info .d{background:var(--m);color:var(--ink);font-weight:900}
.term{left:250px;top:150px;background:var(--ink);border-radius:28px;padding:30px 44px;font:700 52px "DejaVu Sans Mono";color:#3BFF8A;transform:rotate(-6deg)}
.term .dots{display:flex;gap:12px;margin-bottom:14px}.term .dots i{width:20px;height:20px;border-radius:50%;display:block}
.merged{left:1990px;top:500px;background:#2FCF8E;color:#fff;border-radius:999px;padding:22px 50px;font:800 64px "Inter Display";transform:rotate(9deg)}
.plus{left:2080px;top:740px;width:230px;height:230px;border-radius:50%;background:var(--m);color:var(--ink);font:900 110px "Inter Display";display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.no{left:1800px;top:990px;background:#fff;border-radius:16px;padding:16px 28px;font:900 44px "Inter Display";color:var(--b);transform:rotate(4deg);box-shadow:0 0 0 0 #fff}
.logos{position:absolute;left:560px;top:1215px;display:flex;gap:14px;transform:rotate(-1deg)}
.logo{height:64px;padding:0 24px;background:rgba(255,255,255,.8);border:2px dashed rgba(14,17,36,.3);border-radius:12px;display:flex;align-items:center;font:500 22px "Noto Sans CJK SC";color:rgba(14,17,36,.5)}
</style></head><body>
