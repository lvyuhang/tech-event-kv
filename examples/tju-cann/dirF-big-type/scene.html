function keycap(text,col,fg,pos,rot,s=1){const grp=new THREE.Group();

function starShape(R,rr){const s=new THREE.Shape();for(let i=0;i<8;i++){const a=Math.PI/2+i*Math.PI/4,d=i%2?rr:R;const px=Math.cos(a)*d,py=Math.sin(a)*d;i?s.lineTo(px,py):s.moveTo(px,py);}s.closePath();return s;}
