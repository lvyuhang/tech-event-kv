<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden}

  .veil{left:0;top:0;width:1500px;height:620px;background:radial-gradient(ellipse at 20% 30%, rgba(255,246,228,.55) 0%, rgba(255,246,228,.25) 45%, rgba(255,246,228,0) 70%)}

<body>
